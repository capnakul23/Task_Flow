spring.datasource.url=${MYSQL_URL:jdbc:h2:~/taskflow-db}
spring.datasource.username=${MYSQLUSER:sa}
spring.datasource.password=${MYSQLPASSWORD:}
spring.datasource.driver-class-name=${DATASOURCE_DRIVER:org.h2.Driver}
